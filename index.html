    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pixallab_theme') || localStorage.getItem('pixellab_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>

    <script>
      // Single Page Application clean URL restoration from 404 redirect
      (function() {
        var query = window.location.search;
        if (query.indexOf('p=') !== -1) {
          var match = query.match(/[?&]p=([^&]*)/);
          if (match && match[1]) {
            var decoded = decodeURIComponent(match[1]);
            window.history.replaceState(null, '', '/' + decoded + window.location.hash);
          }
        }
      })();
    </script>
