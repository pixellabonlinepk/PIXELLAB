<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PIXAL LAB — Every Image. More Possibilities.</title>
    <script>
      // Single Page Application redirect script for GitHub Pages and static hosts
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        encodeURIComponent(l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash;
      l.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to PIXAL LAB...</p>
  </body>
</html>
